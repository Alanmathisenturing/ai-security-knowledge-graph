[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiskg"
version = "0.1.0"
description = "AI Security Knowledge Graph"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AI-SKG Contributors" }]
license = { text = "MIT" }
keywords = ["ai-security", "knowledge-graph", "ontology", "taxonomy", "security"]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "networkx>=3.2,<4",
  "typer>=0.12,<1",
  "rich>=13.4,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
aiskg = "aiskg.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=src/aiskg --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
packages = ["aiskg"]
check_untyped_defs = true
warn_unused_ignores = true
